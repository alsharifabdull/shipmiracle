<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 330" width="1200" height="330" font-family="Inter,system-ui,sans-serif" role="img" aria-label="Loop: Brief, Plan, owner approval, Build, Test, Review, Ship. A failed test goes back to Build; hard stops wait for the owner."><rect width="1200" height="330" fill="#ffffff" rx="12"/><line x1="110" y1="150" x2="1088" y2="150" stroke="#b5b5b5" stroke-width="3"/><circle cx="110" cy="150" r="14" fill="#ffffff" stroke="#555555" stroke-width="3"/><text x="110" y="196" text-anchor="middle" font-size="18" fill="#1f1f1f">Brief</text><circle cx="273" cy="150" r="14" fill="#ffffff" stroke="#555555" stroke-width="3"/><text x="273" y="196" text-anchor="middle" font-size="18" fill="#1f1f1f">Plan</text><circle cx="436" cy="150" r="30" fill="#006ab1" opacity=".22"/><circle cx="436" cy="150" r="20" fill="#006ab1"/><text x="436" y="156" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">OK</text><text x="436" y="216" text-anchor="middle" font-size="18" font-weight="700" fill="#006ab1">You approve</text><circle cx="599" cy="150" r="14" fill="#ffffff" stroke="#555555" stroke-width="3"/><text x="599" y="196" text-anchor="middle" font-size="18" fill="#1f1f1f">Build</text><circle cx="762" cy="150" r="14" fill="#ffffff" stroke="#555555" stroke-width="3"/><text x="762" y="196" text-anchor="middle" font-size="18" fill="#1f1f1f">Test</text><circle cx="925" cy="150" r="14" fill="#ffffff" stroke="#555555" stroke-width="3"/><text x="925" y="196" text-anchor="middle" font-size="18" fill="#1f1f1f">Review</text><circle cx="1088" cy="150" r="14" fill="#ffffff" stroke="#555555" stroke-width="3"/><text x="1088" y="196" text-anchor="middle" font-size="18" fill="#1f1f1f">Ship</text><path d="M762 128C762 60 599 60 599 128" fill="none" stroke="#555555" stroke-width="2.5" stroke-dasharray="6 6"/><text x="680.5" y="70" text-anchor="middle" font-size="15" fill="#555555">test fails: fix and retry (twice), then you choose</text><text x="1150" y="240" text-anchor="end" font-size="15" fill="#555555">hard stop, for example a public push:</text><text x="1150" y="260" text-anchor="end" font-size="15" fill="#555555">paused until you decide</text><text x="60" y="300" font-size="17" fill="#555555">Agents do the work. You hold the OK. Nothing moves on without it.</text></svg>